<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
  <title id="t">groundwork</title>
  <desc id="d">A plugin for Claude Code and Codex. Seven layers of choices — language, issue tracker, workflow, deployment strategy, architecture, review, QA — lie under your repository.</desc>
  <style>
    .bg{fill:#FAF9F5}.ink{fill:#1F1E1B}.mute{fill:#6E6C66}.acc{fill:#2F6B5A}
    .repo{fill:#1F1E1B}.repot{fill:#FAF9F5}
    .s1{fill:#EFEADF}.s2{fill:#E8E0D0}.s3{fill:#E0D5C1}.s4{fill:#D7C9B1}.s5{fill:#CDBBA0}.s6{fill:#C2AD8F}.s7{fill:#B69F7E}
    .lab{fill:#4A463F}
    @media (prefers-color-scheme: dark){
      .bg{fill:#151513}.ink{fill:#F3F1EB}.mute{fill:#A29F97}.acc{fill:#8CC7B3}
      .repo{fill:#F3F1EB}.repot{fill:#151513}
      .s1{fill:#24221E}.s2{fill:#2A2722}.s3{fill:#302C26}.s4{fill:#36312A}.s5{fill:#3C362E}.s6{fill:#433B32}.s7{fill:#4A4136}
      .lab{fill:#CFCBC2}
    }
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  </style>
  <rect class="bg" width="1200" height="420" rx="20"/>
  <text class="ink" x="64" y="186" font-size="76" font-weight="700" letter-spacing="-2.5">groundwork</text>
  <text class="ink" x="66" y="240" font-size="25">Choose how your repository works, once.</text>
  <text class="ink" x="66" y="274" font-size="25">Your coding agent builds on top of it.</text>
  <text class="mute" x="66" y="334" font-size="16">A plugin for Claude Code and Codex</text>

  <rect class="repo" x="800" y="70" width="170" height="40" rx="8"/>
  <text class="repot mono" x="885" y="96" font-size="16" text-anchor="middle" font-weight="600">your-repo/</text>

  <g font-size="15">
    <rect class="s1" x="620" y="120" width="530" height="32" rx="6"/>
    <text class="lab" x="640" y="141">QA</text><text class="acc mono" x="1132" y="141" text-anchor="end" font-weight="600">manual</text>
    <rect class="s2" x="620" y="158" width="530" height="32" rx="6"/>
    <text class="lab" x="640" y="179">Review</text><text class="acc mono" x="1132" y="179" text-anchor="end" font-weight="600">app</text>
    <rect class="s3" x="620" y="196" width="530" height="32" rx="6"/>
    <text class="lab" x="640" y="217">Architecture</text><text class="acc mono" x="1132" y="217" text-anchor="end" font-weight="600">unidirectional</text>
    <rect class="s4" x="620" y="234" width="530" height="32" rx="6"/>
    <text class="lab" x="640" y="255">Deployment strategy</text><text class="acc mono" x="1132" y="255" text-anchor="end" font-weight="600">develop + release</text>
    <rect class="s5" x="620" y="272" width="530" height="32" rx="6"/>
    <text class="lab" x="640" y="293">Workflow</text><text class="acc mono" x="1132" y="293" text-anchor="end" font-weight="600">step-loop</text>
    <rect class="s6" x="620" y="310" width="530" height="32" rx="6"/>
    <text class="lab" x="640" y="331">Issue tracker</text><text class="acc mono" x="1132" y="331" text-anchor="end" font-weight="600">local files</text>
    <rect class="s7" x="620" y="348" width="530" height="32" rx="6"/>
    <text class="lab" x="640" y="369">Language</text><text class="acc mono" x="1132" y="369" text-anchor="end" font-weight="600">yours · English</text>
  </g>
</svg>
