<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="t d">
  <title id="t">/groundwork:onboarding — choosing a workflow</title>
  <desc id="d">Onboarding step 3 of 8. Every workflow bundle is compared by pros, cons, and token cost, with the recommended bundle first.</desc>
  <style>
    .win{fill:#FFFFFF;stroke:#E2DFD7}.bar{fill:#F3F1EB}.ink{fill:#1F1E1B}.mute{fill:#7A776F}.acc{fill:#2F6B5A}.rule{stroke:#E8E5DD}.sel{fill:#EAF3EF}
    .lo{fill:#2F6B5A}.md{fill:#8A6A1F}.hi{fill:#A3471B}
    @media (prefers-color-scheme: dark){
      .win{fill:#1B1B19;stroke:#33312C}.bar{fill:#24231F}.ink{fill:#ECE9E2}.mute{fill:#98958D}.acc{fill:#8CC7B3}.rule{stroke:#33312C}.sel{fill:#1F2D28}
      .lo{fill:#8CC7B3}.md{fill:#E2C27A}.hi{fill:#F0A067}
    }
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:15px}
  </style>
  <rect class="win" x="1" y="1" width="1198" height="638" rx="14"/>
  <path class="bar" d="M15 1h1170a14 14 0 0 1 14 14v31H1V15A14 14 0 0 1 15 1z"/>
  <circle cx="28" cy="24" r="7" fill="#FF5F57"/><circle cx="52" cy="24" r="7" fill="#FEBC2E"/><circle cx="76" cy="24" r="7" fill="#28C840"/>
  <text class="mute" x="600" y="29" text-anchor="middle" font-size="14">habit-tracker — /groundwork:onboarding</text>

  <text class="mute" x="40" y="86">Step 3 of 8 · Workflow</text>
  <text class="ink" x="40" y="116" font-size="17">How should work move from an idea to a merged change?</text>

  <text class="mute" x="56" y="164">Bundle</text><text class="mute" x="250" y="164">Pros</text><text class="mute" x="640" y="164">Cons</text><text class="mute" x="1040" y="164">Token cost</text>
  <line class="rule" x1="40" y1="176" x2="1160" y2="176"/>

  <rect class="sel" x="40" y="186" width="1120" height="50" rx="6"/>
  <text class="acc" x="56" y="206" font-weight="600">step-loop</text><text class="acc" x="56" y="226" font-size="13">(Recommended)</text>
  <text class="ink" x="250" y="216">Rounds logged on issue; easy to resume</text><text class="ink" x="640" y="216">Full verify + review on every step</text><text class="hi" x="1040" y="216">High</text>

  <text class="ink" x="56" y="268">design-first</text><text class="ink" x="250" y="268">Structure settled in a doc before code</text><text class="ink" x="640" y="268">Nothing ships until the design is approved</text><text class="hi" x="1040" y="268">High</text>
  <text class="ink" x="56" y="302">tdd-loop</text><text class="ink" x="250" y="302">Every behavior has a test seen failing</text><text class="ink" x="640" y="302">Slow for UI-heavy steps</text><text class="hi" x="1040" y="302">High</text>
  <text class="ink" x="56" y="336">flight</text><text class="ink" x="250" y="336">Remote side effects only at takeoff</text><text class="ink" x="640" y="336">One worktree per issue to set up</text><text class="md" x="1040" y="336">Medium</text>
  <text class="ink" x="56" y="370">quick</text><text class="ink" x="250" y="370">Fix and its review land in minutes</text><text class="ink" x="640" y="370">History lives only in commit messages</text><text class="lo" x="1040" y="370">Low</text>
  <text class="ink" x="56" y="404">review-only</text><text class="ink" x="250" y="404">Keep your workflow; add reviewers</text><text class="ink" x="640" y="404">Nothing tracks whether findings get fixed</text><text class="lo" x="1040" y="404">Low</text>

  <text class="mute" x="40" y="446" font-size="13">Token cost compares bundles within this step. It is an estimate, not a measurement.</text>

  <rect class="sel" x="40" y="474" width="420" height="34" rx="6"/>
  <text class="acc" x="56" y="497">❯ step-loop (Recommended)</text>
  <text class="ink" x="56" y="535">  design-first</text>
  <text class="ink" x="56" y="567">  flight</text>
  <text class="mute" x="56" y="599">  Other — name any bundle above</text>
</svg>
